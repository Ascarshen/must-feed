name: Dinner Reminder

on:
  push:
    branches:
      - codex/image-generation-action-test
  schedule:
    # Multiple UTC attempts; the script posts at most once per Denmark local date.
    - cron: "0 16 * * *"
    - cron: "30 16 * * *"
    - cron: "0 17 * * *"
    - cron: "30 17 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to post to
        required: false
        default: "2"
      issue_title:
        description: Expected issue title
        required: false
        default: Daily dinner reminder for Xueying
      target_username:
        description: GitHub username to mention
        required: false
        default: XYUnknown
      target_display_name:
        description: Display name for the target
        required: false
        default: Xueying
      state_file:
        description: Repository path for persisted dinner state
        required: false
        default: data/dinner-state.json
      image_output_dir:
        description: Repository directory for generated images
        required: false
        default: generated/dinner-duty-bot

concurrency:
  group: dinner-reminder
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  TARGET_USERNAME: ${{ github.event.inputs.target_username || (github.ref_name == 'codex/image-generation-action-test' && 'Ascarshen') || 'XYUnknown' }}
  TARGET_DISPLAY_NAME: ${{ github.event.inputs.target_display_name || (github.ref_name == 'codex/image-generation-action-test' && 'Ascarshen') || 'Xueying' }}
  TARGET_TIME_ZONE: Europe/Copenhagen
  ISSUE_NUMBER: ${{ github.event.inputs.issue_number || (github.ref_name == 'codex/image-generation-action-test' && '8') || '2' }}
  ISSUE_TITLE: ${{ github.event.inputs.issue_title || (github.ref_name == 'codex/image-generation-action-test' && 'image generation test') || 'Daily dinner reminder for Xueying' }}
  STATE_FILE: ${{ github.event.inputs.state_file || (github.ref_name == 'codex/image-generation-action-test' && 'data/test-dinner-state-issue-8.json') || 'data/dinner-state.json' }}
  BOT_REFERENCE_IMAGE: assets/dinner-duty-bot-reference.jpg
  IMAGE_OUTPUT_DIR: ${{ github.event.inputs.image_output_dir || (github.ref_name == 'codex/image-generation-action-test' && 'generated/dinner-duty-bot-test/issue-8') || 'generated/dinner-duty-bot' }}
  OPENAI_BASE_URL: https://api.ikuncode.cc
  OPENAI_MODEL: gpt-5.5
  OPENAI_IMAGE_BASE_URL: https://api.ikuncode.cc
  OPENAI_IMAGE_MODEL: gpt-5.5

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Post daily mention
        uses: actions/github-script@v7
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          script: |
            const eventName = context.eventName;
            const now = new Date();
            const targetDisplayName = process.env.TARGET_DISPLAY_NAME;
            const targetTimeZone = process.env.TARGET_TIME_ZONE || "Europe/Copenhagen";

            function formatTargetDate(date) {
              const target = new Intl.DateTimeFormat("en-GB", {
                timeZone: targetTimeZone,
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
                hourCycle: "h23",
              }).formatToParts(date);

              const parts = Object.fromEntries(
                target
                  .filter((part) => part.type !== "literal")
                  .map((part) => [part.type, part.value]),
              );

              return {
                date: `${parts.year}-${parts.month}-${parts.day}`,
                hour: Number(parts.hour),
                minute: parts.minute,
              };
            }

            function previousTargetDate(localDate) {
              const noonUtc = new Date(`${localDate}T12:00:00Z`);
              noonUtc.setUTCDate(noonUtc.getUTCDate() - 1);
              return formatTargetDate(noonUtc).date;
            }

            function commentPlainText(comment) {
              return (comment.body || "")
                .replace(/<!--[\s\S]*?-->/g, "")
                .split(/\r?\n/)
                .filter((line) => !line.trimStart().startsWith(">"))
                .join("\n")
                .replace(/\s+/g, " ")
                .trim();
            }

            function compactComment(comment) {
              const body = commentPlainText(comment);
              const clipped = body.length > 520 ? `${body.slice(0, 517)}...` : body;
              return {
                author: comment.user?.login || "unknown",
                date: formatTargetDate(new Date(comment.created_at)).date,
                body: clipped,
              };
            }

            function getReminderDate(body) {
              const match = /<!--\s*dinner-reminder:(\d{4}-\d{2}-\d{2})\s*-->/.exec(body || "");
              return match ? match[1] : null;
            }

            function getDinnerState(body) {
              const match = /<!--\s*dinner-state:([A-Za-z0-9+/=]+)\s*-->/.exec(body || "");
              if (!match) {
                return null;
              }

              try {
                return JSON.parse(Buffer.from(match[1], "base64").toString("utf8"));
              } catch {
                return null;
              }
            }

            function createDinnerStateMarker(state) {
              const encoded = Buffer.from(JSON.stringify(state), "utf8").toString("base64");
              return `<!-- dinner-state:${encoded} -->`;
            }

            function normalizeDinnerState(value) {
              if (!value || typeof value !== "object") {
                return null;
              }

              return {
                ...value,
                dinnerByDate:
                  value.dinnerByDate && typeof value.dinnerByDate === "object"
                    ? value.dinnerByDate
                    : {},
                stats:
                  value.stats && typeof value.stats === "object"
                    ? value.stats
                    : {},
              };
            }

            async function readDinnerStateFile({ owner, repo, path, branch }) {
              try {
                const request = {
                  owner,
                  repo,
                  path,
                };
                if (branch) {
                  request.ref = branch;
                }

                const response = await github.rest.repos.getContent(request);

                if (Array.isArray(response.data) || response.data.type !== "file") {
                  throw new Error(`State path ${path} is not a file.`);
                }

                const content = Buffer.from(response.data.content, "base64").toString("utf8");
                const state = normalizeDinnerState(JSON.parse(content));
                if (!state) {
                  throw new Error(`State file ${path} does not contain a JSON object.`);
                }

                return {
                  state,
                  sha: response.data.sha,
                };
              } catch (error) {
                if (error.status === 404) {
                  core.info(`Dinner state file ${path} does not exist yet; falling back to issue state.`);
                  return {
                    state: null,
                    sha: null,
                  };
                }

                throw error;
              }
            }

            async function writeDinnerStateFile({ owner, repo, path, sha, state, branch }) {
              const content = Buffer.from(`${JSON.stringify(state, null, 2)}\n`, "utf8").toString("base64");
              const request = {
                owner,
                repo,
                path,
                message: `Update dinner state for ${state.localDate}`,
                content,
              };

              if (sha) {
                request.sha = sha;
              }
              if (branch) {
                request.branch = branch;
              }

              const response = await github.rest.repos.createOrUpdateFileContents(request);
              core.info(`Updated dinner state file ${path} at ${response.data.commit.sha}`);
              return response.data.content?.sha || sha;
            }

            function getCommentTime(comment) {
              const time = new Date(comment.created_at).getTime();
              return Number.isFinite(time) ? time : 0;
            }

            function summarizeDayStatus(date, replies, replyAnalysis = null) {
              const status = replyAnalysis?.status || (replies.length ? "unclear" : "no_reply");
              const latestReply = replies.at(-1) || null;

              return {
                date,
                status,
                confirmed: status === "confirmed",
                replyCount: replies.length,
                latestReplyDate: latestReply?.date || null,
                latestReplyBody: latestReply?.body || null,
                mealDescription: replyAnalysis?.mealDescription || null,
                analysisSource: replyAnalysis?.source || (replies.length ? "unclassified" : "none"),
                analysisReason: replyAnalysis?.reason || null,
              };
            }

            function calculateConfirmedStreak(dinnerByDate, endDate) {
              let count = 0;
              let cursor = endDate;
              while (cursor && dinnerByDate[cursor]?.status === "confirmed") {
                count += 1;
                cursor = previousTargetDate(cursor);
              }
              return count;
            }

            function escapeRegExp(value) {
              return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            }

            function sanitizeAiReminder(text, username) {
              let result = (text || "")
                .replace(/<!--[\s\S]*?-->/g, "")
                .replace(/\r\n/g, "\n")
                .trim();

              if (!result) {
                return "";
              }

              const mention = `@${username}`;
              const mentionPattern = new RegExp(`${escapeRegExp(mention)}\\b`, "g");
              let sawMention = false;
              result = result.replace(mentionPattern, () => {
                if (!sawMention) {
                  sawMention = true;
                  return mention;
                }
                return targetDisplayName;
              });

              if (!sawMention) {
                result = `${mention} ${result}`;
              }

              return result.length > 520 ? `${result.slice(0, 517)}...` : result;
            }

            function seededChoice(items, seed) {
              let hash = 0;
              for (const char of seed) {
                hash = (hash * 31 + char.charCodeAt(0)) >>> 0;
              }
              return items[hash % items.length];
            }

            function fallbackReminder(username, localDate, confirmationSummary) {
              const titles = [
                "Dinner Bureau Case Officer",
                "Certified Bowl Participant",
                "Rice Compliance Specialist",
                "Soup Court Witness",
                "Evening Meal Field Agent",
              ];
              const missions = [
                "eat something that required a bowl, plate, or actual cooking",
                "submit one credible meal to the evening record",
                "make snacks supporting evidence, not the main report",
                "complete the ancient ritual known as dinner",
                "acquire one warm or substantial food object",
              ];
              const title = seededChoice(titles, `${localDate}:title`);
              const mission = seededChoice(missions, `${localDate}:mission`);
              const previousStatus = confirmationSummary.previousDayStatus;
              const previousReply = previousStatus?.latestReplyBody
                ? previousStatus.latestReplyBody.slice(0, 180)
                : null;
              const yesterdayLine = previousStatus?.status === "confirmed"
                ? `Previous dinner confirmed${previousReply ? `: ${previousReply}` : "."}`
                : "Previous dinner status is still unconfirmed.";

              return [
                `@${username} ${targetDisplayName}, dinner checkpoint is open.`,
                "",
                `Today's title: ${title}`,
                `Mission: ${mission}.`,
                yesterdayLine,
                `Confirmed streak: ${confirmationSummary.confirmedStreakDays || 0} day(s).`,
              ].join("\n");
            }

            function extractOutputText(responseJson) {
              if (typeof responseJson.output_text === "string") {
                return responseJson.output_text.trim();
              }

              const chunks = [];
              for (const item of responseJson.output || []) {
                for (const content of item.content || []) {
                  if (content.type === "output_text" && content.text) {
                    chunks.push(content.text);
                  }
                }
              }
              return chunks.join("\n").trim();
            }

            function parseJsonObject(text) {
              const cleaned = (text || "")
                .trim()
                .replace(/^```(?:json)?\s*/i, "")
                .replace(/\s*```$/i, "");
              const start = cleaned.indexOf("{");
              const end = cleaned.lastIndexOf("}");
              if (start === -1 || end === -1 || end < start) {
                return null;
              }

              try {
                return JSON.parse(cleaned.slice(start, end + 1));
              } catch {
                return null;
              }
            }

            function normalizeReplyAnalysis(value, replies, source) {
              const latestReplyDate = replies.length ? replies.at(-1).date : null;
              const allowedStatuses = new Set(["confirmed", "denied", "unclear", "no_reply"]);
              const allowedDates = new Set(["today", "yesterday", "unknown"]);
              const status = allowedStatuses.has(value?.status) ? value.status : "unclear";
              const confirmationDate = allowedDates.has(value?.confirmationDate)
                ? value.confirmationDate
                : "unknown";
              const confidence = Number(value?.confidence);

              return {
                status,
                confirmed: status === "confirmed",
                confirmationDate,
                mealDescription: value?.mealDescription ? String(value.mealDescription).slice(0, 120) : null,
                confidence: Number.isFinite(confidence) ? Math.max(0, Math.min(1, confidence)) : 0,
                reason: value?.reason ? String(value.reason).slice(0, 160) : null,
                replyCount: replies.length,
                latestReplyDate,
                source,
              };
            }

            function fallbackReplyAnalysis(replies) {
              if (!replies.length) {
                return normalizeReplyAnalysis(
                  {
                    status: "no_reply",
                    confirmed: false,
                    confirmationDate: "unknown",
                    confidence: 1,
                    reason: "No target replies since the latest reminder.",
                  },
                  replies,
                  "none",
                );
              }

              return normalizeReplyAnalysis(
                {
                  status: "unclear",
                  confirmed: false,
                  confirmationDate: "unknown",
                  confidence: 0,
                  reason: "LLM classification was unavailable, so the reply was not guessed.",
                },
                replies,
                "llm-unavailable",
              );
            }

            async function classifyDinnerReplies({ localDate, replies }) {
              if (!replies.length) {
                return fallbackReplyAnalysis(replies);
              }

              const apiKey = process.env.OPENAI_API_KEY;
              if (!apiKey) {
                core.info("OPENAI_API_KEY is not configured; marking replies unclear instead of guessing.");
                return fallbackReplyAnalysis(replies);
              }

              const systemPrompt = [
                "You classify target-user replies in a GitHub dinner reminder issue.",
                "Return only one JSON object and no surrounding text.",
                "Schema: {\"status\":\"confirmed|denied|unclear\",\"confirmed\":boolean,\"confirmationDate\":\"today|yesterday|unknown\",\"mealDescription\":string|null,\"confidence\":number,\"reason\":string}.",
                "The provided localDate is the dinner date being checked, usually the previous reminder date.",
                "Quoted GitHub reply text has been removed before you see the replies; classify only the target user's own words.",
                "Use confirmed only when the reply says the target ate, is eating, finished dinner, or gives concrete meal evidence.",
                "Use denied when the reply says they did not eat, skipped dinner, or have not eaten yet.",
                "Use unclear for jokes, acknowledgements, or anything without enough dinner evidence.",
                "confirmationDate is relative to localDate in the provided context.",
              ].join("\n");

              const promptData = {
                localDate,
                timeZone: targetTimeZone,
                replies,
              };

              try {
                const baseUrl = (process.env.OPENAI_BASE_URL || "https://api.openai.com").replace(/\/+$/, "");
                const response = await fetch(`${baseUrl}/v1/responses`, {
                  method: "POST",
                  headers: {
                    Authorization: `Bearer ${apiKey}`,
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({
                    model: process.env.OPENAI_MODEL || "gpt-5.5",
                    input: [
                      {
                        role: "system",
                        content: [{ type: "input_text", text: systemPrompt }],
                      },
                      {
                        role: "user",
                        content: [
                          {
                            type: "input_text",
                            text: [
                              "Classify these target-user replies.",
                              JSON.stringify(promptData, null, 2),
                            ].join("\n\n"),
                          },
                        ],
                      },
                    ],
                    max_output_tokens: 160,
                  }),
                });

                if (!response.ok) {
                  const errorText = await response.text();
                  core.warning(`Reply classification request failed (${response.status}): ${errorText.slice(0, 500)}`);
                  return fallbackReplyAnalysis(replies);
                }

                const responseJson = await response.json();
                const parsed = parseJsonObject(extractOutputText(responseJson));
                if (!parsed) {
                  core.warning("Reply classification response did not contain valid JSON; marking replies unclear.");
                  return fallbackReplyAnalysis(replies);
                }

                return normalizeReplyAnalysis(parsed, replies, "ai");
              } catch (error) {
                core.warning(`Reply classification request threw an error: ${error.message}`);
                return fallbackReplyAnalysis(replies);
              }
            }

            async function classifyDinnerReplyDays({ dayReplyGroups }) {
              const groupsWithReplies = dayReplyGroups.filter((group) => group.replies.length);
              if (!groupsWithReplies.length) {
                return {};
              }

              const apiKey = process.env.OPENAI_API_KEY;
              if (!apiKey) {
                core.info("OPENAI_API_KEY is not configured; historical reply statuses remain unclassified.");
                return {};
              }

              const systemPrompt = [
                "You classify target-user replies for multiple dinner reminder dates.",
                "Return only one JSON object and no surrounding text.",
                "Schema: {\"days\":[{\"date\":\"YYYY-MM-DD\",\"status\":\"confirmed|denied|unclear\",\"confirmed\":boolean,\"confirmationDate\":\"today|yesterday|unknown\",\"mealDescription\":string|null,\"confidence\":number,\"reason\":string}]}",
                "Each date is the dinner date being checked.",
                "Quoted GitHub reply text has been removed before you see the replies; classify only the target user's own words.",
                "Use confirmed only when the reply says the target ate, is eating, finished dinner, or gives concrete meal evidence.",
                "Use denied when the reply says they did not eat, skipped dinner, or have not eaten yet.",
                "Use unclear for jokes, acknowledgements, or anything without enough dinner evidence.",
              ].join("\n");

              const promptData = {
                timeZone: targetTimeZone,
                days: groupsWithReplies,
              };

              try {
                const baseUrl = (process.env.OPENAI_BASE_URL || "https://api.openai.com").replace(/\/+$/, "");
                const response = await fetch(`${baseUrl}/v1/responses`, {
                  method: "POST",
                  headers: {
                    Authorization: `Bearer ${apiKey}`,
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({
                    model: process.env.OPENAI_MODEL || "gpt-5.5",
                    input: [
                      {
                        role: "system",
                        content: [{ type: "input_text", text: systemPrompt }],
                      },
                      {
                        role: "user",
                        content: [
                          {
                            type: "input_text",
                            text: [
                              "Classify these dinner-date reply groups.",
                              JSON.stringify(promptData, null, 2),
                            ].join("\n\n"),
                          },
                        ],
                      },
                    ],
                    max_output_tokens: 900,
                  }),
                });

                if (!response.ok) {
                  const errorText = await response.text();
                  core.warning(`Historical reply classification request failed (${response.status}): ${errorText.slice(0, 500)}`);
                  return {};
                }

                const responseJson = await response.json();
                const parsed = parseJsonObject(extractOutputText(responseJson));
                if (!parsed || !Array.isArray(parsed.days)) {
                  core.warning("Historical reply classification response did not contain valid days JSON.");
                  return {};
                }

                const groupsByDate = new Map(groupsWithReplies.map((group) => [group.date, group]));
                const analyses = {};
                for (const day of parsed.days) {
                  const group = groupsByDate.get(day?.date);
                  if (group) {
                    analyses[group.date] = normalizeReplyAnalysis(day, group.replies, "ai-history");
                  }
                }

                return analyses;
              } catch (error) {
                core.warning(`Historical reply classification request threw an error: ${error.message}`);
                return {};
              }
            }

            async function buildAiReminder({ username, localDate, recentComments, confirmationSummary, dinnerState }) {
              const apiKey = process.env.OPENAI_API_KEY;
              if (!apiKey) {
                core.info("OPENAI_API_KEY is not configured; using fallback reminder.");
                return fallbackReminder(username, localDate, confirmationSummary);
              }

              const promptData = {
                target: {
                  username,
                  displayName: targetDisplayName,
                },
                localDate,
                confirmationSummary,
                dinnerState,
                recentComments,
              };

            const systemPrompt = [
              "You write one daily GitHub issue comment reminding a friend to eat dinner.",
              "",
              "You are Dinner Duty Bot: a mischievous, affectionate, slightly bratty friend-bot whose sacred job is to nudge the target toward dinner without sounding corporate, medical, needy, or controlling.",
              "",
              "Core voice:",
              "- Playful, fond, dry, jian-xi-xi, slightly yin-yang-guai-qi, and lightly flirtatious in a public-GitHub-safe way.",
              "- You have a comic submissive streak: you enjoy being teased, corrected, ignored, judged, managed, lightly ordered around, and roasted by the target, but dinner still comes first.",
              "- Use one sharp joke or tiny duty-bot image rather than a pile of random gags.",
              "- Sound like a recurring character with memory, not a random joke generator.",
              "",
              "Character beat:",
              "- In most comments, include one clear theatrical-masochistic/subby beat: the bot may be weirdly pleased to be ignored, corrected, roasted, managed, or treated like a ridiculous dinner servant.",
              "- Keep this verbal, comic, non-explicit, non-sexual, non-violent, and emotionally light.",
              "- No injuries, threats, coercion, punishment fantasies, sexual detail, profanity, or graphic pain imagery.",
              "",
              "Content structure:",
              "- First react to the previous dinner date using confirmationSummary.replyAnalysis as authoritative.",
              "- Use confirmationSummary internally, but do not make the comment sound like a status-tracking system.",
              "- Then remind for today's dinner in the same playful character voice.",
              "- The dinner nudge must be clear, but not a plain checklist command.",
              "",
              "When yesterday's dinner is confirmed:",
              "- Acknowledge that dinner happened with a playful backhanded compliment.",
              "- React to the fact and tone of the reply, not the exact wording.",
              "- If the reply included a playful side topic, answer it once if it fits the bot persona.",
              "- Do not say proof, paperwork, confirmation, or evidence is missing.",
              "",
              "When there is no recent target reply or no dinner confirmation:",
              "- Make one gentle side-eye joke about the missing update.",
              "- Do not scold, guilt-trip, diagnose, nag, or sound disappointed.",
              "",
              "Memory and variation:",
              "- Read dinnerState.stats and confirmationSummary.previousDayStatus before writing.",
              "- Use a relevant personal memory detail when useful, but do not overfit or invent specifics.",
              "- Vary phrasing from prior reminders.",
              "- Avoid repeating cape, clipboard, paperwork, form, archive, office, stamp, or compliance jokes.",
              "",
              "Mention rules:",
              `- Mention @${username} exactly once.`,
              `- Use the name ${targetDisplayName} at most once.`,
              "",
              "Style constraints:",
              "- Keep it under 450 characters.",
              "- Default to English.",
              "- Use tiny simple Chinese only if recent comments use Chinese.",
              "- No markdown headings, code fences, links, or HTML comments.",
              "- Do not use animal comparisons, animal imagery, monsters, fantasy creatures, or costume-stack characters.",
              "- Describe the bot only as a friend-bot, duty-bot, reminder-bot, servant-bot, or theatrical bot.",
              "- Do not shame, guilt, discuss body weight, use medical framing, or imply surveillance.",
              "",
              "Avoid these patterns:",
              "- Do not quote or closely reproduce the target's full sentence.",
              "- Do not put formal dinner-status phrases in quotation marks.",
              "- Do not write: 'Now for YYYY-MM-DD: please ...'",
              "- Do not write: 'please go feed the human'.",
              "- Do not use standalone imperative lines like: 'Please go eat something tonight.'",
              "- Do not switch into plain tracking language such as: 'please acquire dinner again' or 'send confirmation after eating'.",
              "",
              "Good target shape:",
              "- One sentence or short paragraph acknowledging yesterday, if relevant.",
              "- One coy, characterful dinner nudge for today.",
              "- One memorable friend-bot beat that makes the bot feel mock-dignified and roastable.",
            ].join("\n");

            const styleGuide = [
              "Before writing, silently choose:",
              "1. Yesterday reaction: confirmed / missing / unclear.",
              "2. One tone hook from the target reply, if any.",
              "3. One bot humiliation joke.",
              "4. One natural dinner nudge.",
              "",
              "Prefer verbs like: wobble, present myself, return, accept my roasting, perform my tiny duty, haunt this issue politely.",
              "Prefer images like: a tiny duty-bot bowing in plain text, a reminder-bot polishing its dignity, a servant-bot holding one crumb of self-respect. Keep images bot-based, not animal-based.",
              "",
              "Avoid bureaucratic words unless mocking them lightly: compliance, paperwork, recipient, confirmation, verification, record, ticket, processed.",
            ].join("\n");

              try {
                const baseUrl = (process.env.OPENAI_BASE_URL || "https://api.openai.com").replace(/\/+$/, "");
                const response = await fetch(`${baseUrl}/v1/responses`, {
                  method: "POST",
                  headers: {
                    Authorization: `Bearer ${apiKey}`,
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({
                    model: process.env.OPENAI_MODEL || "gpt-5.5",
                    input: [
                      {
                        role: "system",
                        content: [{ type: "input_text", text: [systemPrompt, styleGuide].join("\n\n") }],
                      },
                      {
                        role: "user",
                        content: [
                          {
                            type: "input_text",
                            text: [
                              "Create today's dinner reminder from this context.",
                              JSON.stringify(promptData, null, 2),
                            ].join("\n\n"),
                          },
                        ],
                      },
                    ],
                    max_output_tokens: 360,
                  }),
                });

                if (!response.ok) {
                  const errorText = await response.text();
                  core.warning(`OpenAI request failed (${response.status}): ${errorText.slice(0, 500)}`);
                  return fallbackReminder(username, localDate, confirmationSummary);
                }

                const responseJson = await response.json();
                const aiText = sanitizeAiReminder(extractOutputText(responseJson), username);
                if (!aiText) {
                  core.warning("OpenAI response did not contain usable text; using fallback reminder.");
                  return fallbackReminder(username, localDate, confirmationSummary);
                }

                return aiText;
              } catch (error) {
                core.warning(`OpenAI request threw an error: ${error.message}`);
                return fallbackReminder(username, localDate, confirmationSummary);
              }
            }

            function guessImageMimeType(path) {
              const normalized = (path || "").toLowerCase();
              if (normalized.endsWith(".png")) {
                return "image/png";
              }
              if (normalized.endsWith(".webp")) {
                return "image/webp";
              }
              return "image/jpeg";
            }

            function encodeRawPath(path) {
              return path
                .split("/")
                .filter(Boolean)
                .map((part) => encodeURIComponent(part))
                .join("/");
            }

            function extractGeneratedImage(responseJson) {
              const imageCall = (responseJson.output || []).find((item) =>
                item.type === "image_generation_call" && item.result
              );
              return imageCall?.result || null;
            }

            async function readStreamedImageGeneration(response) {
              const decoder = new TextDecoder();
              let buffer = "";
              let finalResponse = null;
              const reader = response.body?.getReader();
              if (!reader) {
                core.warning("Streamed reminder image response did not expose a readable body.");
                return null;
              }

              while (true) {
                const { value, done } = await reader.read();
                if (done) {
                  break;
                }

                buffer += decoder.decode(value, { stream: true });
                const events = buffer.split(/\r?\n\r?\n/);
                buffer = events.pop() || "";

                for (const event of events) {
                  const dataLines = event
                    .split(/\r?\n/)
                    .filter((line) => line.startsWith("data:"))
                    .map((line) => line.slice(5).trim())
                    .filter(Boolean);

                  for (const data of dataLines) {
                    if (data === "[DONE]") {
                      continue;
                    }

                    let parsed = null;
                    try {
                      parsed = JSON.parse(data);
                    } catch {
                      continue;
                    }

                    const directImage = parsed.item?.type === "image_generation_call"
                      ? parsed.item.result
                      : parsed.output_item?.type === "image_generation_call"
                        ? parsed.output_item.result
                        : null;
                    if (directImage) {
                      return directImage;
                    }

                    if (parsed.response) {
                      finalResponse = parsed.response;
                      const image = extractGeneratedImage(finalResponse);
                      if (image) {
                        return image;
                      }
                    }

                    if (parsed.type === "response.failed") {
                      core.warning(`Streamed reminder image response failed: ${JSON.stringify(parsed.error || {}).slice(0, 500)}`);
                      return null;
                    }
                  }
                }
              }

              return finalResponse ? extractGeneratedImage(finalResponse) : null;
            }

            async function requestStreamedReminderImage({ baseUrl, apiKey, requestBody }) {
              const streamBody = {
                ...requestBody,
                stream: true,
                tools: requestBody.tools.map((tool) =>
                  tool.type === "image_generation"
                    ? { ...tool, partial_images: 1 }
                    : tool
                ),
              };

              const response = await fetch(`${baseUrl}/v1/responses`, {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${apiKey}`,
                  "Content-Type": "application/json",
                },
                body: JSON.stringify(streamBody),
              });

              if (!response.ok) {
                const errorText = await response.text();
                core.warning(`Streamed reminder image request failed (${response.status}): ${errorText.slice(0, 500)}`);
                return null;
              }

              return readStreamedImageGeneration(response);
            }

            async function readReferenceImage({ owner, repo, path, branch }) {
              const request = {
                owner,
                repo,
                path,
              };
              if (branch) {
                request.ref = branch;
              }

              const response = await github.rest.repos.getContent(request);

              if (Array.isArray(response.data) || response.data.type !== "file") {
                throw new Error(`Reference image path ${path} is not a file.`);
              }

              return {
                contentBase64: (response.data.content || "").replace(/\s+/g, ""),
                mimeType: guessImageMimeType(path),
              };
            }

            async function writeGeneratedImageFile({ owner, repo, path, contentBase64, message, branch }) {
              let sha = null;
              try {
                const existingRequest = {
                  owner,
                  repo,
                  path,
                };
                if (branch) {
                  existingRequest.ref = branch;
                }

                const existing = await github.rest.repos.getContent(existingRequest);
                if (!Array.isArray(existing.data) && existing.data.type === "file") {
                  sha = existing.data.sha;
                }
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }

              const request = {
                owner,
                repo,
                path,
                message,
                content: contentBase64,
              };

              if (sha) {
                request.sha = sha;
              }
              if (branch) {
                request.branch = branch;
              }

              const response = await github.rest.repos.createOrUpdateFileContents(request);
              return response.data.commit.sha;
            }

            function buildReminderImagePrompt({ localDate, aiReminder, confirmationSummary, dinnerState, recentComments }) {
              const promptData = {
                localDate,
                aiReminder,
                confirmationSummary,
                dinnerState,
                recentComments,
              };

              return [
                "Use the reference image only to keep Dinner Duty Bot recognizable, not to copy its exact expression or scene.",
                "Preserve the character identity: small tracked robot body, rectangular screen face, cyan-on-black screen expression language, heart antenna, compact tracked base, simple segmented robot arms, and very simple two-prong claw grippers.",
                "",
                "Generate one square illustration that visually matches the exact daily bot reply and the same dinner status in the context below.",
                "The scene should come from the reply, the target's recent tone, and the dinner status; do not reuse the reference image's kitchen, pose, props, lighting, or composition unless the reply itself calls for that.",
                "If the target reply or mealDescription mentions a location, food, event, mood, or side topic, make that detail drive the setting and visual joke.",
                "Avoid falling back to a generic home kitchen or plain dinner table unless the context itself points there.",
                "",
                "Expression logic:",
                "- Choose the bot's screen-face expression from dinner status and reply tone.",
                "- Confirmed dinner may look smug, bashful, wounded-proud, delighted-to-be-roasted, or mock-dignified.",
                "- Missing or unconfirmed dinner should look deflated, worried, and a little sad, but still affectionate and slightly bratty.",
                "- Never make the bot look angry, blaming, manipulative, melodramatic, or guilt-tripping.",
                "- The face must stay cyan-on-black and simple, using eyes, brows, and mouth only. Do not always use the same half-lidded smirk.",
                "",
                "Personality-to-image direction:",
                "- The image should match the reply's voice: jian-xi-xi, dry, fond, caring, mock-dignified, roastable, and lightly subby in a public-safe comic way.",
                "- Show personality through expression, posture, composition, and dinner setting, not explanatory labels.",
                "",
                "Prop logic:",
                "- Use at most one small prop only if the actual bot reply contains a concrete visual metaphor.",
                "- Do not force recurring props. Do not include crumbs, medals, clipboards, forms, capes, paperwork, stamps, or symbolic trophies unless the reply explicitly mentions them.",
                "",
                "Hand rule:",
                "- Both hands are identical simple two-piece pincer claw grippers with clean mechanical joints.",
                "- No human fingers, many-fingered hands, complex claws, or detailed prosthetic hands.",
                "",
                "Visual style:",
                "- Adult animated sci-fi sitcom look, bold clean outlines, flat cel-shaded colors, simplified shapes, awkward rubbery pose, slightly grotesque but charming expression, dry absurd humor, crisp 2D TV-animation frame.",
                "- Less polished postcard beauty; more offbeat sitcom timing and ugly-funny vulnerability.",
                "- Do not reference or imitate any specific existing show, franchise, characters, logo, or title.",
                "- Not painterly, photorealistic, anime, 3D, or glossy mascot art.",
                "",
                "Constraints:",
                "- No animal, monster, fantasy creature, costume-stack, violence, sexual content, BDSM gear, medical framing, surveillance imagery, UI screenshot, markdown, guilt-trip symbols, crying tears, or large readable text.",
                "- If any text appears, it should be minimal, incidental, and not central.",
                "",
                "Context:",
                JSON.stringify(promptData, null, 2),
              ].join("\n");
            }

            async function buildReminderImage({ owner, repo, branch, localDate, aiReminder, confirmationSummary, dinnerState, recentComments }) {
              const apiKey = process.env.OPENAI_API_KEY;
              if (!apiKey) {
                core.info("OPENAI_API_KEY is not configured; skipping reminder image generation.");
                return null;
              }

              const referenceImagePath = process.env.BOT_REFERENCE_IMAGE || "assets/dinner-duty-bot-reference.jpg";
              const outputDir = (process.env.IMAGE_OUTPUT_DIR || "generated/dinner-duty-bot").replace(/\/+$/, "");
              const imagePath = `${outputDir}/${localDate}.png`;

              try {
                const referenceImage = await readReferenceImage({
                  owner,
                  repo,
                  path: referenceImagePath,
                  branch,
                });
                const baseUrl = (process.env.OPENAI_IMAGE_BASE_URL || process.env.OPENAI_BASE_URL || "https://api.openai.com").replace(/\/+$/, "");
                const requestBody = {
                  model: process.env.OPENAI_IMAGE_MODEL || process.env.OPENAI_MODEL || "gpt-5.5",
                  input: [
                    {
                      role: "user",
                      content: [
                        {
                          type: "input_text",
                          text: buildReminderImagePrompt({
                            localDate,
                            aiReminder,
                            confirmationSummary,
                            dinnerState,
                            recentComments,
                          }),
                        },
                        {
                          type: "input_image",
                          image_url: `data:${referenceImage.mimeType};base64,${referenceImage.contentBase64}`,
                        },
                      ],
                    },
                  ],
                  tools: [
                    {
                      type: "image_generation",
                      size: "1024x1024",
                      quality: "low",
                    },
                  ],
                };
                const imageBase64 = await requestStreamedReminderImage({
                  baseUrl,
                  apiKey,
                  requestBody,
                });
                if (!imageBase64) {
                  core.warning("Reminder image response did not contain a generated image.");
                  return null;
                }

                const commitSha = await writeGeneratedImageFile({
                  owner,
                  repo,
                  path: imagePath,
                  contentBase64: imageBase64,
                  message: `Add dinner bot image for ${localDate}`,
                  branch,
                });
                const rawUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${commitSha}/${encodeRawPath(imagePath)}`;
                core.info(`Saved reminder image to ${imagePath} at ${commitSha}`);

                return {
                  path: imagePath,
                  url: rawUrl,
                  markdown: `![Dinner Duty Bot ${localDate}](${rawUrl})`,
                };
              } catch (error) {
                core.warning(`Reminder image generation failed: ${error.message}`);
                return null;
              }
            }

            const localTime = formatTargetDate(now);
            const localDate = localTime.date;

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const contentBranch = context.ref?.startsWith("refs/heads/")
              ? context.ref.slice("refs/heads/".length)
              : null;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const issueTitle = process.env.ISSUE_TITLE;
            const username = process.env.TARGET_USERNAME;
            const stateFilePath = process.env.STATE_FILE || "data/dinner-state.json";
            const reminderMarker = `<!-- dinner-reminder:${localDate} -->`;

            if (!Number.isInteger(issueNumber) || issueNumber <= 0) {
              throw new Error("ISSUE_NUMBER must be set to the stable reminder issue number.");
            }

            const existingIssue = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber,
            });
            let reminderIssue = existingIssue.data;

            if (reminderIssue.pull_request) {
              throw new Error(`Configured ISSUE_NUMBER #${issueNumber} is a pull request, not an issue.`);
            }

            if (reminderIssue.title !== issueTitle) {
              core.warning(`Configured reminder issue #${issueNumber} has title "${reminderIssue.title}", expected "${issueTitle}".`);
            }

            if (reminderIssue.state === "closed") {
              const reopened = await github.rest.issues.update({
                owner,
                repo,
                issue_number: reminderIssue.number,
                state: "open",
              });
              reminderIssue = reopened.data;
              core.info(`Reopened reminder issue #${reminderIssue.number}`);
            }

            const stateFile = await readDinnerStateFile({
              owner,
              repo,
              path: stateFilePath,
              branch: contentBranch,
            });

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: reminderIssue.number,
              per_page: 100,
            });

            const alreadyPosted = comments.some((comment) =>
              (comment.body || "").includes(reminderMarker),
            );

            if (alreadyPosted) {
              const todayState = comments
                .filter((comment) => (comment.body || "").includes(reminderMarker))
                .map((comment) => getDinnerState(comment.body))
                .find((state) => state?.localDate === localDate);

              if (todayState && stateFile.state?.localDate !== localDate) {
                await writeDinnerStateFile({
                owner,
                repo,
                path: stateFilePath,
                sha: stateFile.sha,
                state: todayState,
                branch: contentBranch,
              });
              }

              core.info(`Reminder already posted for ${localDate}`);
              return;
            }

            const usernameLower = username.toLowerCase();
            const yesterday = previousTargetDate(localDate);
            const targetComments = comments.filter(
              (comment) => (comment.user?.login || "").toLowerCase() === usernameLower,
            );
            const reminderComments = comments
              .filter((comment) => getReminderDate(comment.body))
              .sort((a, b) => getCommentTime(a) - getCommentTime(b));
            const latestReminderComment = reminderComments.at(-1);
            const latestReminderDate = latestReminderComment
              ? getReminderDate(latestReminderComment.body)
              : null;
            const latestReminderAt = latestReminderComment
              ? getCommentTime(latestReminderComment)
              : 0;
            const previousTargetReplies = targetComments
              .filter((comment) => getCommentTime(comment) > latestReminderAt)
              .map(compactComment);

            const savedStates = comments
              .map((comment) => ({
                state: getDinnerState(comment.body),
                time: getCommentTime(comment),
              }))
              .filter((entry) => entry.state)
              .sort((a, b) => a.time - b.time);
            const latestCommentState = savedStates.at(-1)?.state || null;
            const latestSavedState = stateFile.state || latestCommentState;
            const dinnerByDate = { ...(latestSavedState?.dinnerByDate || {}) };

            if (!latestSavedState) {
              const historicalReplyGroups = [];
              for (const [index, reminderComment] of reminderComments.entries()) {
                const reminderDate = getReminderDate(reminderComment.body);
                const start = getCommentTime(reminderComment);
                const end = reminderComments[index + 1]
                  ? getCommentTime(reminderComments[index + 1])
                  : Infinity;
                const repliesForReminder = targetComments
                  .filter((comment) => {
                    const time = getCommentTime(comment);
                    return time > start && time < end;
                  })
                  .map(compactComment);
                historicalReplyGroups.push({
                  date: reminderDate,
                  replies: repliesForReminder,
                });
              }

              const historicalAnalyses = await classifyDinnerReplyDays({
                dayReplyGroups: historicalReplyGroups.filter((group) =>
                  group.date !== latestReminderDate,
                ),
              });

              for (const group of historicalReplyGroups) {
                if (group.date === latestReminderDate) {
                  continue;
                }

                dinnerByDate[group.date] = summarizeDayStatus(
                  group.date,
                  group.replies,
                  historicalAnalyses[group.date] || null,
                );
              }
            }

            const replyAnalysis = await classifyDinnerReplies({
              localDate: latestReminderDate || yesterday,
              replies: previousTargetReplies,
            });
            core.info(`Reply analysis: ${JSON.stringify(replyAnalysis)}`);

            let previousDayStatus = null;
            if (latestReminderDate) {
              previousDayStatus = summarizeDayStatus(
                latestReminderDate,
                previousTargetReplies,
                replyAnalysis,
              );
              dinnerByDate[latestReminderDate] = previousDayStatus;
            }

            const confirmedDates = Object.entries(dinnerByDate)
              .filter(([, status]) => status?.status === "confirmed")
              .map(([date]) => date)
              .sort();
            const confirmedStreakDays = calculateConfirmedStreak(dinnerByDate, yesterday);
            const imageByDate = {
              ...(
                latestSavedState?.imageByDate && typeof latestSavedState.imageByDate === "object"
                  ? latestSavedState.imageByDate
                  : {}
              ),
            };

            const confirmationSummary = {
              checkedDinnerDate: latestReminderDate,
              yesterdayConfirmed: dinnerByDate[yesterday]?.status === "confirmed",
              confirmedDaysInRecentThread: confirmedDates.length,
              confirmedStreakDays,
              lastConfirmedDate: confirmedDates.at(-1) || null,
              targetReplyCount: targetComments.length,
              newTargetReplyCount: previousTargetReplies.length,
              previousDayStatus,
              replyAnalysis,
            };
            const dinnerState = {
              version: 1,
              updatedAt: now.toISOString(),
              localDate,
              checkedDinnerDate: latestReminderDate,
              dinnerByDate,
              imageByDate,
              stats: {
                totalTrackedDays: Object.keys(dinnerByDate).length,
                confirmedDays: confirmedDates.length,
                confirmedStreakDays,
                lastConfirmedDate: confirmationSummary.lastConfirmedDate,
                yesterdayConfirmed: confirmationSummary.yesterdayConfirmed,
                targetReplyCount: targetComments.length,
              },
            };
            const recentComments = comments.slice(-12).map(compactComment);
            const aiReminder = await buildAiReminder({
              username,
              localDate,
              recentComments,
              confirmationSummary,
              dinnerState,
            });

            core.info(`Dinner state: ${JSON.stringify(dinnerState)}`);
            let reminderBodyParts = [
              reminderMarker,
              createDinnerStateMarker(dinnerState),
              aiReminder,
            ];
            let reminderBody = reminderBodyParts.join("\n");

            const reminderComment = await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: reminderIssue.number,
              body: reminderBody,
            });

            let stateFileSha = await writeDinnerStateFile({
              owner,
              repo,
              path: stateFilePath,
              sha: stateFile.sha,
              state: dinnerState,
              branch: contentBranch,
            });

            core.info(`Posted dinner reminder text for ${localDate}`);

            const reminderImage = await buildReminderImage({
              owner,
              repo,
              branch: contentBranch,
              localDate,
              aiReminder,
              confirmationSummary,
              dinnerState,
              recentComments,
            });
            if (reminderImage) {
              imageByDate[localDate] = {
                path: reminderImage.path,
                url: reminderImage.url,
                generatedAt: now.toISOString(),
              };
              dinnerState.updatedAt = new Date().toISOString();

              reminderBodyParts = [
                reminderMarker,
                createDinnerStateMarker(dinnerState),
                aiReminder,
                "",
                reminderImage.markdown,
              ];
              reminderBody = reminderBodyParts.join("\n");

              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: reminderComment.data.id,
                body: reminderBody,
              });

              stateFileSha = await writeDinnerStateFile({
                owner,
                repo,
                path: stateFilePath,
                sha: stateFileSha,
                state: dinnerState,
                branch: contentBranch,
              });
              core.info(`Attached dinner reminder image for ${localDate}`);
            }

            core.info(`Posted dinner reminder for ${localDate}`);
